global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: /metrics

  - job_name: 'storage'
    static_configs:
      - targets: ['storage:8082']
    metrics_path: /metrics

  - job_name: 'tagger'
    static_configs:
      - targets: ['tagger:8081']
    metrics_path: /metrics
