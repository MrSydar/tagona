name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-vet:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [api, keystorage, storage, tagger]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  e2e-compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Verify e2e module compiles
        working-directory: e2e
        env:
          GOWORK: off
        run: |
          go mod download
          go test -count=0 ./...

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the OpenAPI document
        run: npx --yes @redocly/cli@1 lint api/openapi/v1.yaml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Run gofmt check
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

  # Builds the service images exactly as the release workflow does (but
  # for one platform and without pushing), so a broken Dockerfile fails the PR
  # instead of the release.
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, keystorage, storage, tagger]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: tagona-${{ matrix.service }}:ci
          cache-from: type=gha,scope=docker-${{ matrix.service }}
          cache-to: type=gha,scope=docker-${{ matrix.service }},mode=max,ignore-error=true

      - name: Image runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id tagona-${{ matrix.service }}:ci -u)"
          echo "uid=${uid}"
          test "${uid}" != "0"

      - name: Image is linked to this repository
        run: |
          source="$(docker inspect tagona-${{ matrix.service }}:ci --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
          echo "source=${source}"
          test "${source}" = "https://github.com/MrSydar/tagona"

  # The release workflow's version, tag and changelog logic lives in shell scripts so it
  # can be tested here, long before the first real release.
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the release scripts
        run: .github/scripts/test-release-scripts.sh
