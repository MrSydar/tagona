name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    # Postgres for the storage database tests (skipped when the DSN is unset).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tagona
          POSTGRES_PASSWORD: tagona
          POSTGRES_DB: tagona
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tagona -d tagona"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TAGONA_TEST_PG_DSN: postgres://tagona:tagona@localhost:5432/tagona?sslmode=disable
    strategy:
      matrix:
        module: [api, storage, tagger]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race ./...
