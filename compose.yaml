# Tagona stack.
#
#   docker compose up --build -d       build the api, storage, keystorage and tagger images from source (tagged :dev)
#
# To run the released images from GHCR instead of building (see RELEASING.md):
#
#   TAGONA_VERSION=0.1.0 docker compose pull api storage keystorage tagger
#   TAGONA_VERSION=0.1.0 docker compose up -d --no-build
#
# TAGONA_VERSION can also be set in .env. It defaults to "dev", a tag that only
# exists locally, so a plain `up --build` never pulls a published image.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: tagona
      POSTGRES_PASSWORD: tagona
      POSTGRES_DB: tagona
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tagona -d tagona"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: creates the database roles (one per service, each limited to its own tables) and
  # moves a pre-keystorage api_keys table into the keys schema. See postgres/roles.sql. The
  # passwords are demo defaults; the services' DSNs below use the same variables.
  db-init:
    image: postgres:15
    environment:
      PGHOST: postgres
      PGUSER: tagona
      PGPASSWORD: tagona
      PGDATABASE: tagona
    volumes:
      - ./postgres/roles.sql:/roles.sql:ro
    command:
      - psql
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-v"
      - "storage_password=${TAGONA_STORAGE_DB_PASSWORD:-tagona_storage}"
      - "-v"
      - "keys_password=${TAGONA_KEYS_DB_PASSWORD:-tagona_keys}"
      - "-f"
      - "/roles.sql"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  garage:
    image: dxflrs/garage:v2.3.0
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: tagonadev
      GARAGE_DEFAULT_SECRET_KEY: tagona-dev-secret
      GARAGE_DEFAULT_BUCKET: tagona
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"
      - "3903:3903"
    healthcheck:
      test: ["CMD", "/garage", "json-api", "GetClusterHealth"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  tagger:
    image: ghcr.io/mrsydar/tagona-tagger:${TAGONA_VERSION:-dev}
    build:
      context: .
      dockerfile: tagger/Dockerfile
    env_file:
      - path: .env
        required: false   # optional: without it the tagger defaults to the offline grep evaluator
    environment:
      TAGGER_HTTP_ADDR: ":8081"
      TAGGER_STORAGE_BASE_URL: "http://storage:8082"
    ports:
      - "8081:8081"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  storage:
    image: ghcr.io/mrsydar/tagona-storage:${TAGONA_VERSION:-dev}
    build:
      context: .
      dockerfile: storage/Dockerfile
    environment:
      TAGONA_HTTP_ADDR: ":8082"
      TAGONA_PG_DSN: "postgres://tagona_storage:${TAGONA_STORAGE_DB_PASSWORD:-tagona_storage}@postgres:5432/tagona?sslmode=disable"
      TAGONA_S3_ENDPOINT: "http://garage:3900"
      # the S3 address clients download payloads from (storage signs short-lived URLs for it); with an
      # external object store, its own public address
      TAGONA_S3_PUBLIC_ENDPOINT: "${TAGONA_S3_PUBLIC_ENDPOINT:-http://localhost:3900}"
      TAGONA_DATA_URL_TTL: "${TAGONA_DATA_URL_TTL:-60s}"
      TAGONA_S3_REGION: "us-east-1"
      TAGONA_S3_BUCKET: "tagona"
      TAGONA_S3_ACCESS_KEY: "tagonadev"
      TAGONA_S3_SECRET_KEY: "tagona-dev-secret"
      TAGONA_S3_FORCE_PATH_STYLE: "true"
      # a tagger router (TAGGER_EVALUATOR_IMPL=router) here supports several taggers at once
      TAGONA_TAG_ENGINE_URL: "http://tagger:8081"
      TAGONA_DEFAULT_LIMIT: "5"
      TAGONA_MAX_LIMIT: "100"
      TAGONA_DEFAULT_TTL: "0"
      TAGONA_MAX_TAGS_PER_QUERY: "100"
      TAGONA_MAX_OBJECT_SIZE_BYTES: "10485760"
      TAGONA_RETENTION_SWEEP_INTERVAL: "60s"
    expose:
      - "8082"
    depends_on:
      db-init:
        condition: service_completed_successfully
      garage:
        condition: service_healthy
      tagger:
        condition: service_healthy   # a collection created without a tagger_version gets the tagger's
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # API key storage and validation. The only service whose database role can reach the api_keys
  # table. Reachable on the compose network only: key management checks the admin credentials
  # itself, and validation is open to the api (and, in Tagona Plus, the translator).
  keystorage:
    image: ghcr.io/mrsydar/tagona-keystorage:${TAGONA_VERSION:-dev}
    build:
      context: .
      dockerfile: keystorage/Dockerfile
    environment:
      KEYSTORAGE_HTTP_ADDR: ":8083"
      KEYSTORAGE_PG_DSN: "postgres://tagona_keys:${TAGONA_KEYS_DB_PASSWORD:-tagona_keys}@postgres:5432/tagona?sslmode=disable"
      KEYSTORAGE_PG_SCHEMA: "keys"
      KEYSTORAGE_ADMIN_USERNAME: "admin"
      KEYSTORAGE_ADMIN_PASSWORD: "tagona"
    expose:
      - "8083"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/mrsydar/tagona-api:${TAGONA_VERSION:-dev}
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      API_HTTP_ADDR: ":8080"
      API_STORAGE_BASE_URL: "http://storage:8082"
      API_KEYSTORAGE_BASE_URL: "http://keystorage:8083"
    ports:
      - "8080:8080"
    depends_on:
      storage:
        condition: service_healthy
      keystorage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - api
      - tagger

volumes:
  postgres_data:
  garage_meta:
  garage_data:
  prometheus_data:
  grafana_data:
