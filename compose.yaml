services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: tagbase
      POSTGRES_PASSWORD: tagbase
      POSTGRES_DB: tagbase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tagbase -d tagbase"]
      interval: 5s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.3.0
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: tagbasedev
      GARAGE_DEFAULT_SECRET_KEY: tagbase-dev-secret
      GARAGE_DEFAULT_BUCKET: tagbase
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"
      - "3903:3903"
    healthcheck:
      test: ["CMD", "/garage", "json-api", "GetClusterHealth"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  tagger:
    build:
      context: .
      dockerfile: tagger/Dockerfile
    env_file:
      - .env
    environment:
      TAGGER_HTTP_ADDR: ":8081"
      TAGGER_STORAGE_BASE_URL: "http://storage:8080"
    ports:
      - "8081:8081"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  storage:
    build:
      context: .
      dockerfile: storage/Dockerfile
    environment:
      TAGBASE_HTTP_ADDR: ":8080"
      TAGBASE_PG_DSN: "postgres://tagbase:tagbase@postgres:5432/tagbase?sslmode=disable"
      TAGBASE_S3_ENDPOINT: "http://garage:3900"
      TAGBASE_S3_REGION: "us-east-1"
      TAGBASE_S3_BUCKET: "tagbase"
      TAGBASE_S3_ACCESS_KEY: "tagbasedev"
      TAGBASE_S3_SECRET_KEY: "tagbase-dev-secret"
      TAGBASE_S3_FORCE_PATH_STYLE: "true"
      TAGBASE_TAG_ENGINE_URL: "http://tagger:8081"
      TAGBASE_DEFAULT_LIMIT: "5"
      TAGBASE_MAX_LIMIT: "100"
      TAGBASE_DEFAULT_TTL: "0"
      TAGBASE_MAX_TAGS_PER_QUERY: "100"
      TAGBASE_MAX_OBJECT_SIZE_BYTES: "10485760"
      TAGBASE_RETENTION_SWEEP_INTERVAL: "60s"
    ports:
      - "8080:8080"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      tagger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - storage
      - tagger

volumes:
  postgres_data:
  garage_meta:
  garage_data:
  prometheus_data:
  grafana_data:
