# Tagona stack.
#
#   docker compose up --build -d       build the api, storage and tagger images from source (tagged :dev)
#
# To run the released images from GHCR instead of building (see RELEASING.md):
#
#   TAGONA_VERSION=0.1.0 docker compose pull api storage tagger
#   TAGONA_VERSION=0.1.0 docker compose up -d --no-build
#
# TAGONA_VERSION can also be set in .env. It defaults to "dev", a tag that only
# exists locally, so a plain `up --build` never pulls a published image.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: tagona
      POSTGRES_PASSWORD: tagona
      POSTGRES_DB: tagona
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tagona -d tagona"]
      interval: 5s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.3.0
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: tagonadev
      GARAGE_DEFAULT_SECRET_KEY: tagona-dev-secret
      GARAGE_DEFAULT_BUCKET: tagona
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"
      - "3903:3903"
    healthcheck:
      test: ["CMD", "/garage", "json-api", "GetClusterHealth"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  tagger:
    image: ghcr.io/mrsydar/tagona-tagger:${TAGONA_VERSION:-dev}
    build:
      context: .
      dockerfile: tagger/Dockerfile
    env_file:
      - path: .env
        required: false   # optional: without it the tagger defaults to the offline grep evaluator
    environment:
      TAGGER_HTTP_ADDR: ":8081"
      TAGGER_STORAGE_BASE_URL: "http://storage:8082"
    ports:
      - "8081:8081"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  storage:
    image: ghcr.io/mrsydar/tagona-storage:${TAGONA_VERSION:-dev}
    build:
      context: .
      dockerfile: storage/Dockerfile
    environment:
      TAGONA_HTTP_ADDR: ":8082"
      TAGONA_PG_DSN: "postgres://tagona:tagona@postgres:5432/tagona?sslmode=disable"
      TAGONA_S3_ENDPOINT: "http://garage:3900"
      TAGONA_S3_REGION: "us-east-1"
      TAGONA_S3_BUCKET: "tagona"
      TAGONA_S3_ACCESS_KEY: "tagonadev"
      TAGONA_S3_SECRET_KEY: "tagona-dev-secret"
      TAGONA_S3_FORCE_PATH_STYLE: "true"
      TAGONA_TAG_ENGINE_URL: "http://tagger:8081"
      TAGONA_DEFAULT_LIMIT: "5"
      TAGONA_MAX_LIMIT: "100"
      TAGONA_DEFAULT_TTL: "0"
      TAGONA_MAX_TAGS_PER_QUERY: "100"
      TAGONA_MAX_OBJECT_SIZE_BYTES: "10485760"
      TAGONA_RETENTION_SWEEP_INTERVAL: "60s"
    expose:
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      tagger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/mrsydar/tagona-api:${TAGONA_VERSION:-dev}
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      API_HTTP_ADDR: ":8080"
      API_STORAGE_BASE_URL: "http://storage:8082"
      API_ADMIN_USERNAME: "admin"
      API_ADMIN_PASSWORD: "tagona"
    expose:
      - "8080"
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  traefik:
    image: traefik:v3.6
    environment:
      EDGE_RATE_LIMIT_AVERAGE: "${EDGE_RATE_LIMIT_AVERAGE:-200}"
      EDGE_RATE_LIMIT_BURST: "${EDGE_RATE_LIMIT_BURST:-400}"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    ports:
      - "8080:8080"   # plain HTTP
      - "8443:8443"   # TLS
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - api
      - tagger

volumes:
  postgres_data:
  garage_meta:
  garage_data:
  prometheus_data:
  grafana_data:
