# Dynamic configuration: routing and middlewares. The rate limit values are
# filled from the Traefik container environment (see compose.yaml).
http:
  routers:
    api-web:
      entryPoints: [web]
      rule: "PathPrefix(`/v1`) || Path(`/healthz`) || Path(`/readyz`)"
      middlewares: [rate-limit]
      service: api
    api-websecure:
      entryPoints: [websecure]
      rule: "PathPrefix(`/v1`) || Path(`/healthz`) || Path(`/readyz`)"
      middlewares: [rate-limit]
      service: api
      tls: {}

  middlewares:
    # Coarse per-IP limit; per-API-key limits are enforced by the api service.
    rate-limit:
      rateLimit:
        average: {{ env "EDGE_RATE_LIMIT_AVERAGE" | default "200" }}
        period: 1s
        burst: {{ env "EDGE_RATE_LIMIT_BURST" | default "400" }}

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api:8080"
