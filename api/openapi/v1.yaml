openapi: 3.0.3
info:
  title: Tagona API
  version: 1.7.0
  description: |
    Storage for collections of objects with sparse boolean tags that are evaluated on demand.

    **Contract version.** This document describes the `/v1` API. `info.version` is the
    semantic version of this contract: additions bump the minor version. While Tagona is a draft, a
    breaking change is announced in the changelog and also bumps the minor version; once it is stable,
    breaking changes will ship as `/v2` with its own document.

    **Authentication.** Every `/v1/collections...` and `/v1/taggers` request needs `Authorization: Bearer <api key>`.
    Keys are minted with the admin endpoints, which use HTTP Basic auth.
    The documentation endpoints (`/v1/docs`, `/v1/openapi.json`, `/v1/openapi.yaml`) are public.

    **Limits.** Request bodies are capped (`413 payload_too_large`).

    **Retention.** Objects are stored permanently unless they have an expiry: either the server's
    default TTL (off by default) or the `ttl_seconds` upload parameter. Expired objects disappear
    from the API immediately and are removed from storage by a background sweeper. The exact rules
    are described under *Upload an object*.

    **Tags are sparse.** An object only has a value for a tag after the tag was evaluated for it
    (by a query or a tags request). A tag that was not evaluated is *unknown*. Both tag-aware
    endpoints accept `evaluate=false` to answer from known tags only, without calling the
    tagging engine.

    **Strict requests.** The gateway checks every request against what its endpoint accepts and refuses
    anything else with `400` before it reaches an internal service: a query parameter the endpoint does not
    define (`invalid_parameter`), a parameter given more than once (`invalid_parameter`), a JSON field it
    does not define or data after the JSON object (`invalid_json`), and a body on an endpoint that takes none
    (`unexpected_body`). Values are checked for their form (numbers, timestamps, booleans, identifiers); limits
    that are configured in the service, such as the maximum page size, are enforced by the service. Every
    parameter and field an endpoint accepts is documented here, and there are no others.

    **Tagger versions.** Different taggers (and different models behind them) may tag the same object
    differently, so a collection records the version of the tagger that tags it: `tagger_version`, a string
    that by convention is `<implementation>` or `<implementation>:<model>`, for example `grep`, `false` or
    `decisions/openai:zai-org/GLM-5.3-Flash`. Objects are plain bytes; what a tagger makes of them is its
    business. When a tag has to be evaluated, the tagging engine is asked for the collection's version and
    refuses if it does not serve it (`409 tagger_version_mismatch`): its answers are never stored under a
    version they did not come from. Requests that need no evaluation (`evaluate=false`, or tags that are all
    known) are not affected.

    **Metadata.** An object can carry metadata, a map of string keys to string values that the uploader
    chooses, for example `{"name": "cute-dog.png"}`. It is set when the object is uploaded and can be
    replaced or changed later. Limits: at most 32 entries; keys of 1-64 bytes without control characters;
    values of at most 1024 bytes. Metadata is returned wherever an object is, and is not searchable.

    **Errors** always have the shape `{"error": {"code": "...", "message": "..."}}`.
  license:
    name: See LICENSE
    url: https://github.com/MrSydar/tagona/blob/main/LICENSE
servers:
  - url: /
    description: This server
tags:
  - name: Taggers
    description: The tagger versions a collection can be tagged with.
  - name: Collections
    description: Create, list and delete collections. A collection is tagged with one tagger version.
  - name: Objects
    description: Upload, download, query and delete objects, and change their metadata.
  - name: Tags
    description: Tag values and per-collection tag statistics.
  - name: Admin
    description: API key management. Uses HTTP Basic admin credentials, not an API key.
security:
  - bearerAuth: []
paths:
  /v1/taggers:
    get:
      tags: [Taggers]
      operationId: listTaggers
      summary: List the available taggers
      description: >-
        The versions the tagging engine serves, as it reports them at its `/version`: one for a plain tagger, one
        per tagger when the engine is a router over several taggers. A collection is tagged with one of them
        (`tagger_version` of *Create a collection*). Takes no parameters.
      responses:
        "200":
          description: The tagger versions.
          content:
            application/json:
              schema:
                type: object
                required: [taggers]
                properties:
                  taggers:
                    type: array
                    items: { type: string }
              example:
                taggers: [grep, "decisions/openai:zai-org/GLM-5.3-Flash"]
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "502":
          description: "`tag_engine_error`: the tagging engine's versions could not be fetched."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/collections:
    get:
      tags: [Collections]
      operationId: listCollections
      summary: List collections
      description: >-
        Collections are listed newest first, at most `limit` per page (default 100, at most 1000). When more
        follow, the answer carries `next`: pass it as `cursor` to get the next page, and repeat until an
        answer has no `next`.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: A page of collections. `collections` is `null` when there are none.
          content:
            application/json:
              schema:
                type: object
                properties:
                  collections:
                    type: array
                    nullable: true
                    items:
                      $ref: "#/components/schemas/Collection"
                  next:
                    type: string
                    description: Present only when more collections follow. Pass it as `cursor`.
              example:
                collections:
                  - { id: 5b0c5bd0-5c4e-4a0b-9d4a-6f6a0f3d9a11, name: photos, tagger_version: "decisions/openai:zai-org/GLM-5.3-Flash", created_at: "2026-06-13T12:05:00Z" }
                  - { id: 0a5e1d0e-3b1e-4f43-8f0c-0c1d2e3f4a5b, name: jobs, tagger_version: grep, created_at: "2026-06-13T12:00:00Z" }
                next: azE3ODEzMDYzMDAwMDAwMHw1YjBjNWJkMC01YzRlLTRhMGItOWQ0YS02ZjZhMGYzZDlhMTE
        "400":
          description: "`invalid_parameter`, `unexpected_body`, `invalid_limit` or `invalid_cursor`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/NotReady" }
    post:
      tags: [Collections]
      operationId: createCollection
      summary: Create a collection
      description: |
        A collection is tagged with one tagger version (see *Tagger versions* above); *List the available
        taggers* shows the choices. `tagger_version` may be left out when the tagging engine serves exactly one
        version, which the collection then gets; when it serves several, leaving it out is
        `400 tagger_version_required` and `details.available` lists them. A version that is not served can be
        given too: such a collection can be queried with `evaluate=false`, and evaluated once a tagger of that
        version runs. Objects are plain bytes of any kind, so a collection has no data type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          description: "`invalid_json`, `invalid_parameter`, `invalid_name`, `invalid_tagger_version` or `tagger_version_required` (several taggers are served: `details.available` lists them)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`already_exists`: a collection with this name exists."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`tag_engine_error`: `tagger_version` was left out and the tagging engine's versions could not be fetched."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/collections/{collection}:
    parameters:
      - $ref: "#/components/parameters/Collection"
    delete:
      tags: [Collections]
      operationId: deleteCollection
      summary: Delete a collection
      description: Deletes the collection together with all its objects, tags and stored payloads.
      responses:
        "204":
          description: Deleted
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/collections/{collection}/tags:
    parameters:
      - $ref: "#/components/parameters/Collection"
    get:
      tags: [Tags]
      operationId: listCollectionTags
      summary: Object count and registered tags of a collection
      description: |
        Returns the number of objects in the collection and every tag registered in it, with how
        many objects the tag is known true for, known false for, and not yet evaluated for.
        Tags are ordered by name (byte order). A tag stays registered once seen, even if all objects
        carrying it are later deleted. Expired objects are excluded even before they are removed.
        Tags are listed at most `limit` per page (default 100, at most 1000); when more follow, the answer
        carries `next`: pass it as `cursor` to get the next page. `prefix` keeps only tags that start with it.
      parameters:
        - name: prefix
          in: query
          description: Only tags starting with this literal prefix (at most 128 bytes).
          schema: { type: string, maxLength: 128 }
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Counts and tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionTags"
        "400":
          description: "`invalid_collection_name`, `invalid_parameter`, `unexpected_body`, `invalid_limit`, `invalid_prefix` or `invalid_cursor`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/collections/{collection}/objects:
    parameters:
      - $ref: "#/components/parameters/Collection"
    post:
      tags: [Objects]
      operationId: uploadObject
      summary: Upload an object
      description: |
        The request body is the raw payload. Uploads are idempotent by content: the SHA-256 of the
        bytes identifies the object within the collection, and uploading the same bytes again
        returns the existing object (`200`) instead of creating a new one (`201`).

        **Expiry and retention.** An object has an expiry if the upload sets `ttl_seconds` or the server
        has a default TTL configured (`TAGONA_DEFAULT_TTL`, off by default). With neither, the object is
        stored permanently.

        Once an object has expired it is no longer visible: lookups answer `404`, queries skip it, and it
        is excluded from collection counts and tag statistics. Its data is deleted afterwards by a
        background retention sweeper that runs every `TAGONA_RETENTION_SWEEP_INTERVAL` (60 seconds by
        default) and removes expired objects in batches, oldest first. Storage is therefore reclaimed
        shortly after expiry, and later when very many objects expire at about the same time.

        Uploading identical content again while the object is still valid returns the existing object
        and does not change its expiry. After the object has expired, the same content is stored as a
        new object with a new `id`. The expiry of an existing object cannot be changed; delete the
        object and upload it again instead.

        **Metadata.** `metadata` attaches string key-value pairs to the new object. When the content already
        exists, the existing object is returned as it is, with its own metadata: use *Replace the metadata of
        an object* or *Change some metadata of an object* to change it.
      parameters:
        - name: metadata
          in: query
          description: |
            A JSON object whose keys and values are strings, URL-encoded, for example
            `{"name":"cute-dog.png"}`. Omit it for no metadata. Limits: at most 32 entries, keys of 1-64
            bytes, values of at most 1024 bytes (`400 invalid_metadata`).
          schema: { type: string, example: '{"name":"cute-dog.png"}' }
        - name: date
          in: query
          description: Object date (RFC 3339). Defaults to the upload time. Queries order by it, newest first.
          schema: { type: string, format: date-time }
        - name: ttl_seconds
          in: query
          description: |
            Lifetime of the object in seconds, counted from the upload.

            **Omit this parameter to use the server default.** With the default configuration
            (`TAGONA_DEFAULT_TTL=0`) the object is then stored permanently; if the operator configured a
            default TTL, that TTL applies instead.

            **Sending the parameter always turns expiry on, whatever the value.** In particular `0` does
            *not* mean "never expire": the object expires immediately and is removed. To store an object
            permanently, leave the parameter out. There is no per-upload way to opt out of a non-zero
            server default.

            Must be a non-negative integer, otherwise `400 invalid_ttl`.
          schema: { type: integer, minimum: 0, example: 3600 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Object created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectUploadResponse" }
        "200":
          description: An object with identical content already exists in the collection; it is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectUploadResponse" }
        "400":
          description: "`invalid_ttl`, `invalid_date`, `invalid_metadata`, `invalid_parameter` or `invalid_collection_name`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/collections/{collection}/objects/query:
    parameters:
      - $ref: "#/components/parameters/Collection"
    post:
      tags: [Objects]
      operationId: queryObjects
      summary: Query objects by tags
      description: |
        Returns objects ordered by `date` (newest first), then `id`. Tag filters are ANDed. Tags that
        are not known for a candidate object are evaluated by the tagging engine and stored, unless
        `evaluate` is `false`.

        With `evaluate: false` the tagging engine is never called and the query is answered from
        known tags only: an object is returned only if every requested tag is known for it and
        matches. Objects whose requested tags were never evaluated are left out, so the result is a
        subset of what an evaluating query returns. No new tags are registered.

        **Evaluation needs the right tagger.** Evaluating asks the tagging engine for the collection's
        `tagger_version`; if the engine runs another one, the query fails with `409 tagger_version_mismatch`
        (see *Tagger versions* above). `evaluate: false` still answers from the tags the collection has.

        **Page size and cursor.** The answer holds at most `limit` objects (default `TAGONA_DEFAULT_LIMIT`, 5; at most
        `TAGONA_MAX_LIMIT`, 100). When more objects match, it carries `next`: send the same query again
        with `cursor` set to it to get the following page, and repeat until an answer has no `next`. Keep
        `tags`, `date` and `evaluate` the same on every page. The cursor marks a position in the order
        (`date`, then `id`), so objects uploaded or deleted between pages do not shift it. With
        `best_effort`, a query that times out also answers with a `next` to continue from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagsQueryRequest"
            examples:
              firstPage:
                summary: First page
                value:
                  tags: { golang: true, qa: false }
                  limit: 5
                  evaluate: true
              nextPage:
                summary: The next page, with the `next` of the previous answer
                value:
                  tags: { golang: true, qa: false }
                  limit: 5
                  evaluate: true
                  cursor: MTc4MTMwNjMwMDAwMHwzYWIxYjZlMC1hMTc5LTQyNGItOTgyNS0yZDI4MTdjNzYxYWU
      responses:
        "200":
          description: Matching objects and, when more exist, a cursor for the next page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagsQueryResponse" }
              example:
                objects:
                  - id: 3ab1b6e0-a179-424b-9825-2d2817c761ae
                    collection: jobs
                    date: "2026-06-07T12:00:00Z"
                    size_bytes: 52
                    content_hash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    created_at: "2026-06-07T12:00:01Z"
                    metadata: { name: senior-go-engineer.txt }
                    tags: { golang: true, qa: false }
                next: MTc4MTMwNjMwMDAwMHwzYWIxYjZlMC1hMTc5LTQyNGItOTgyNS0yZDI4MTdjNzYxYWU
        "400":
          description: >-
            `invalid_json`, `invalid_parameter`, `invalid_limit`, `invalid_cursor`, `invalid_tags`,
            `invalid_date_filter`, `invalid_timeout` or `invalid_collection_name`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaggerVersionMismatch" }
        "500":
          description: "`query_timeout`: the query did not finish within `timeout_ms` (and `best_effort` was off)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`tag_engine_error`: the tagging engine failed."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/collections/{collection}/objects/{id}:
    parameters:
      - $ref: "#/components/parameters/Collection"
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Objects]
      operationId: getObject
      summary: Get an object
      description: The object's properties, including its metadata (not its payload, which is `…/data`).
      responses:
        "200":
          description: The object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Objects]
      operationId: deleteObject
      summary: Delete an object
      description: Hard delete of the object's record, metadata, tags and stored payload.
      responses:
        "204":
          description: Deleted
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/collections/{collection}/objects/{id}/data:
    parameters:
      - $ref: "#/components/parameters/Collection"
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Objects]
      operationId: getObjectData
      summary: Download an object's payload
      description: >-
        Redirects (`307`) to a short-lived, signed URL of the object store, which serves the raw payload
        (`application/octet-stream`) and supports `Range` requests; the payload does not pass through Tagona.
        Follow the redirect without sending the API key on to the object store: the URL itself is the
        credential, valid for `TAGONA_DATA_URL_TTL` (60 seconds by default, and never beyond the object's
        expiry), and for this one payload and the GET method only. Do not cache or share it; ask again when
        it has expired. If the object's metadata has `content_type` (a media type) the store answers with that
        `Content-Type`, and if it has `name` the download is an `attachment` with that file name (cleaned: no
        directories or control characters); a type without a name is a plain `attachment`, so it is never rendered
        from the store's origin. Values that are not usable are ignored, leaving `application/octet-stream`. The object store must be reachable by the client and allow its origin (CORS) for
        downloads from a browser.
      responses:
        "307":
          description: Where to download the payload from.
          headers:
            Location:
              description: The signed URL.
              schema: { type: string, format: uri }
            Cache-Control:
              schema: { type: string, enum: [no-store] }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/collections/{collection}/objects/{id}/metadata:
    parameters:
      - $ref: "#/components/parameters/Collection"
      - $ref: "#/components/parameters/ObjectId"
    put:
      tags: [Objects]
      operationId: replaceObjectMetadata
      summary: Replace the metadata of an object
      description: >-
        The body, a JSON object whose values are strings, becomes the object's metadata; keys that are not in
        it are removed. Send `{}` to remove all metadata. Limits are those listed under *Metadata* above.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Metadata" }
            example: { name: cute-dog.png, photographer: Sam }
      responses:
        "200":
          description: The object, with its new metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "400":
          description: "`invalid_json` (not a JSON object of strings), `invalid_metadata` (a limit was exceeded), `invalid_parameter` or `invalid_collection_name`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Objects]
      operationId: mergeObjectMetadata
      summary: Change some metadata of an object
      description: >-
        Sets the keys of the body and removes those whose value is `null`; all other keys stay. The limits
        apply to the result.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetadataChanges" }
            example: { name: dog.png, photographer: null }
      responses:
        "200":
          description: The object, with its new metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "400":
          description: "`invalid_json` (not a JSON object of strings and nulls), `invalid_metadata` (a limit was exceeded by the result), `invalid_parameter` or `invalid_collection_name`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/collections/{collection}/objects/{id}/tags:
    parameters:
      - $ref: "#/components/parameters/Collection"
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Tags]
      operationId: getObjectTags
      summary: Get or evaluate tags of an object
      description: |
        Without `tags`, returns the tags already known for the object (nothing is evaluated).
        With `tags`, returns exactly those tags: known values come from storage, and missing ones are
        evaluated by the tagging engine and stored, unless `evaluate=false`.

        With `evaluate=false` the tagging engine is not called and requested tags that are not known
        come back as `null`.
      parameters:
        - name: tags
          in: query
          description: Comma-separated tag names (each at most 128 bytes, duplicates ignored).
          schema: { type: string, example: "golang,qa" }
        - name: evaluate
          in: query
          description: Evaluate requested tags that are not yet known.
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Tag values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectTags" }
              examples:
                evaluated:
                  summary: evaluate=true (default)
                  value: { id: 3ab1b6e0-a179-424b-9825-2d2817c761ae, tags: { golang: true, qa: false } }
                notEvaluated:
                  summary: evaluate=false, "java" never evaluated
                  value: { id: 3ab1b6e0-a179-424b-9825-2d2817c761ae, tags: { golang: true, java: null } }
        "400":
          description: "`invalid_tags`, `invalid_tag`, `invalid_evaluate`, `invalid_parameter`, `unexpected_body` or `invalid_collection_name`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaggerVersionMismatch" }
        "502":
          description: "`tag_engine_error`: the tagging engine failed."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/api-keys:
    post:
      tags: [Admin]
      operationId: createApiKey
      summary: Create an API key
      description: |
        The raw key is returned only in this response and cannot be retrieved again.

        A key can expire: pass `ttl_seconds` to make it stop working that many seconds from now. A key
        without `ttl_seconds` uses the server's default lifetime, which is none unless the operator
        configured one, and an operator may also cap the lifetime. An expired key is refused with
        `401 expired_api_key`, and is removed from the list some time after it expired.
      security:
        - adminBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
                ttl_seconds:
                  type: integer
                  format: int64
                  minimum: 1
                  description: >-
                    Lifetime of the key in seconds. Omit it for the server's default. `0` is not a way to say
                    "no expiry": it is refused with `invalid_ttl`, as is a value above the server's maximum.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "400":
          description: "`invalid_json`, `invalid_parameter`, `invalid_name` or `invalid_ttl`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/AdminUnauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
    get:
      tags: [Admin]
      operationId: listApiKeys
      summary: List API keys
      description: |
        Never includes raw keys, only a short prefix. Keys are listed newest first, at most `limit` per page
        (default 100, at most 1000). When more follow, the answer carries `next`: pass it as `cursor` to get
        the next page, and repeat until an answer has no `next`. Expired keys are listed until they are swept.
      security:
        - adminBasicAuth: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKeyInfo" }
                  next:
                    type: string
                    description: Present only when more keys follow. Pass it as `cursor`.
        "400":
          description: "`invalid_parameter`, `unexpected_body`, `invalid_limit` or `invalid_cursor`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/AdminUnauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /v1/admin/api-keys/{id}:
    delete:
      tags: [Admin]
      operationId: deleteApiKey
      summary: Delete an API key
      security:
        - adminBasicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/AdminUnauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "An API key created with `POST /v1/admin/api-keys`, sent as `Authorization: Bearer <key>`."
    adminBasicAuth:
      type: http
      scheme: basic
      description: Admin credentials configured on the server. An API key is rejected on admin endpoints.

  parameters:
    Collection:
      name: collection
      in: path
      required: true
      description: Collection name (1-64 chars, lowercase letters, digits, `_` and `-`, starting with a letter).
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_-]{0,63}$"
        example: jobs
    ObjectId:
      name: id
      in: path
      required: true
      description: The object's `id`.
      schema: { type: string, format: uuid }
    PageLimit:
      name: limit
      in: query
      description: Maximum items per page.
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    PageCursor:
      name: cursor
      in: query
      description: The `next` value of the previous page; leave it out for the first page.
      schema: { type: string }

  responses:
    InvalidRequest:
      description: "`invalid_collection_name`, `invalid_parameter` or `unexpected_body`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TaggerVersionMismatch:
      description: >-
        `tagger_version_mismatch`: a tag had to be evaluated, but the tagging engine does not serve the version the
        collection is tagged with. `details` has `expected` (the collection's) and `running` (the versions the
        engine serves). Nothing was stored. Requests that need no evaluation, such as `evaluate=false`, still work.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: tagger_version_mismatch
              message: 'the collection is tagged with "decisions/openai:m" but the tagging engine serves ["grep"]; query with evaluate=false to use the tags it has'
              details: { expected: "decisions/openai:m", running: [grep] }
    NotFound:
      description: "`not_found`: the collection, object or key does not exist (expired objects count as missing)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: >-
        `missing_api_key` (no or malformed Bearer header), `invalid_api_key` (unknown key) or `expired_api_key`
        (the key existed but has expired; get a new one).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: "`payload_too_large`: the body exceeds the allowed size."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotReady:
      description: "`not_ready`: the storage service is unavailable."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminUnauthorized:
      description: "`invalid_admin_credentials`. The response carries `WWW-Authenticate: Basic`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminForbidden:
      description: >-
        `forbidden` (an API key was presented; it cannot manage keys) or `admin_disabled`
        (admin credentials are not configured on the server).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: not_found }
            message: { type: string, example: not found }
            details: { type: object, additionalProperties: true }

    CollectionCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9_-]{0,63}$", example: jobs }
        tagger_version:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            The tagger version the collection is tagged with, `<implementation>` or
            `<implementation>:<model>`. May be left out when the tagging engine serves only one version.
          example: "decisions/openai:zai-org/GLM-5.3-Flash"

    Collection:
      type: object
      required: [id, name, tagger_version, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tagger_version:
          type: string
          description: The version of the tagger the collection is tagged with, `<implementation>` or `<implementation>:<model>`.
        created_at: { type: string, format: date-time }

    Metadata:
      type: object
      description: String keys to string values. At most 32 entries, keys of 1-64 bytes, values of at most 1024 bytes.
      maxProperties: 32
      additionalProperties: { type: string, maxLength: 1024 }
      example: { name: cute-dog.png }

    MetadataChanges:
      type: object
      description: Keys to set (string values) or to remove (`null`).
      additionalProperties: { type: string, nullable: true, maxLength: 1024 }
      example: { name: dog.png, photographer: null }

    Object:
      type: object
      required: [id, collection, date, size_bytes, content_hash, created_at, metadata]
      properties:
        id: { type: string, format: uuid }
        collection: { type: string }
        metadata: { $ref: "#/components/schemas/Metadata" }
        date: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64 }
        content_hash: { type: string, description: Lowercase hex SHA-256 of the payload. }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: >-
            Present only when the object has an expiry. From this moment the object is no longer returned
            by the API; its data is deleted shortly afterwards by the retention sweeper.
        payload_key: { type: string, description: Internal object-store key; informational only. }
        tags:
          type: object
          description: In query results, the tag filter the object satisfied.
          additionalProperties: { type: boolean }

    ObjectUploadResponse:
      type: object
      required: [id, collection, date, size_bytes, content_hash, metadata]
      properties:
        id: { type: string, format: uuid }
        collection: { type: string }
        metadata: { $ref: "#/components/schemas/Metadata" }
        date: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64 }
        content_hash: { type: string }

    DateFilter:
      type: object
      description: Range on the object date (RFC 3339). `eq` cannot be combined with the others.
      properties:
        gt: { type: string, format: date-time }
        gte: { type: string, format: date-time }
        lt: { type: string, format: date-time }
        lte: { type: string, format: date-time }
        eq: { type: string, format: date-time }

    TagsQueryRequest:
      type: object
      properties:
        tags:
          type: object
          description: Tag name to required value. All must match. Omit for no tag filtering.
          additionalProperties: { type: boolean }
        date: { $ref: "#/components/schemas/DateFilter" }
        limit:
          type: integer
          minimum: 1
          description: >-
            Page size: the most objects the answer holds. Defaults to the server's default (`TAGONA_DEFAULT_LIMIT`,
            5) and may not exceed its maximum (`TAGONA_MAX_LIMIT`, 100): `400 invalid_limit`.
        cursor:
          type: string
          description: >-
            The `next` value of the previous page; leave it out for the first page. Send it with the same
            `tags`, `date` and `evaluate` as the request that returned it.
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 300000
          default: 30000
          description: Query timeout in milliseconds.
        best_effort:
          type: boolean
          default: false
          description: >-
            When the query times out, return the objects found so far (with a `next` cursor) instead of failing.
            No effect when `evaluate` is `false`.
        evaluate:
          type: boolean
          default: true
          description: >-
            When `false`, never call the tagging engine and return only objects whose requested tags are already
            known and matching.

    TagsQueryResponse:
      type: object
      required: [objects]
      properties:
        objects:
          type: array
          items: { $ref: "#/components/schemas/Object" }
        next:
          type: string
          description: >-
            Cursor for the next page: send the query again with this as `cursor`. Absent on the last page.

    ObjectTags:
      type: object
      required: [id, tags]
      properties:
        id: { type: string, format: uuid }
        tags:
          type: object
          description: Tag name to value. A value is `null` only when `evaluate=false` and the tag was never evaluated.
          additionalProperties:
            type: boolean
            nullable: true

    TagStat:
      type: object
      required: [tag, true_count, false_count, first_seen_at]
      properties:
        tag: { type: string }
        true_count: { type: integer, format: int64, description: Objects the tag is known true for. }
        false_count: { type: integer, format: int64, description: Objects the tag is known false for. }
        first_seen_at: { type: string, format: date-time }

    CollectionTags:
      type: object
      required: [collection, total_objects, tags]
      properties:
        collection: { type: string }
        total_objects:
          type: integer
          format: int64
          description: Objects in the whole collection, not only those matching `prefix`.
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagStat" }
        next:
          type: string
          description: Cursor for the next page; absent on the last page.

    ApiKeyCreated:
      type: object
      required: [id, name, key, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key: { type: string, description: The raw key. Shown only once., example: tagona_3f9c… }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the key stops working; `null` for a key that never expires.

    ApiKeyInfo:
      type: object
      required: [id, name, key_prefix, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key_prefix: { type: string }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the key stops working; `null` for a key that never expires. A key stays listed for a while
            after it expired.
